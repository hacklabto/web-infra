# images/ is a host mount, so mediawiki's images/.htaccess isn't there to rely on
<Directory /var/www/html/images>
	AllowOverride None
	Options -Indexes
	php_admin_flag engine off
	<FilesMatch "\.(php|phtml|phar)$">
		Require all denied
	</FilesMatch>
	Header set X-Content-Type-Options nosniff
</Directory>

# installer isn't needed once LocalSettings.php exists
RedirectMatch 404 ^/mw-config(/|$)

ServerTokens Prod
ServerSignature Off
